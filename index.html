<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 블로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #fffdf6;
    --ink: #111;
    --soft: #3d3d3d;
    --line: #b89455;
    --chip: #ee861c;
    --paper: #f5f5f5;
    --font: "Gulim Che", "굴림체", Gulim, "굴림", "Dotum Che", Dotum, "Nanum Gothic Coding", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--sky); color: var(--ink);
    font-family: var(--font); font-size: 13px; line-height: 1.6; letter-spacing: -0.04em;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 36px 20px 90px; }

  header { text-align: center; margin-bottom: 26px; }
  .site-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; margin: 0 0 4px; }
  .hint { font-style: italic; color: var(--soft); font-size: 12px; margin: 0 0 8px; }
  .btn {
    display: inline-block; padding: 1px 6px; background: var(--paper); border: 1px solid #999;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.75), 1px 1px 0 rgba(0,0,0,.25); cursor: pointer;
  }
  .btn:active { box-shadow: inset 1px 1px 0 rgba(0,0,0,.25); transform: translate(1px,1px); }
  .btn.primary { background: var(--chip); color: #fff; border-color: var(--chip); }
  .btn[disabled] { opacity: .5; cursor: default; }

  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 18px auto 0; max-width: 620px; }
  .tag-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px 2px 5px;
    border: 1px solid var(--line); border-radius: 2px; background: transparent;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.85), inset -1px -1px 0 rgba(200,180,140,.3); cursor: pointer;
  }
  .tag-btn:hover { background: rgba(255,255,255,.7); }
  .tag-btn.active { background: var(--chip); color: #fff; border-color: var(--chip); box-shadow: none; }
  button:focus-visible, input:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }
  .count { color: var(--soft); font-size: 11px; text-align: center; margin: 14px 0 22px; }
  .note { text-align: center; color: #a33; font-size: 12px; margin: 10px 0 0; }

  .grid { columns: 5 130px; column-gap: 18px; }
  .card { break-inside: avoid; margin: 0 0 22px; }
  .thumb {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); font-size: 30px; color: rgba(0,0,0,.55);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 2px, transparent 2px 8px);
  }
  img.thumb { display: block; width: 100%; height: auto; background: #fff; }
  .card-title { margin: 5px 0 0; font-size: 12px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  .card.pick .thumb { outline: 2px solid var(--chip); outline-offset: 2px; }
  .card.pick .card-title { color: var(--chip); font-weight: 700; }
  .tools { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .tools .btn { font-size: 11px; padding: 0 4px; }
  .empty { text-align: center; color: var(--soft); padding: 40px 0; }

  .card > a { display: block; }
  .card > a:hover .card-title { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
  .chip { background: var(--chip); color: #fff; border: 1px solid #f8e8c6; padding: 0 3px; font-size: 10px; line-height: 1.4; }

  /* 게시물 화면 */
  article { max-width: 560px; margin: 0 auto; }
  .back { display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--chip); }
  article h1 { font-size: 17px; line-height: 1.4; margin: 0 0 6px; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.02em; }
  article .thumb { margin-top: 14px; }
  article div.thumb { height: 220px; font-size: 54px; }
  .comments { margin-top: 30px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .comments h2 { font-size: 13px; margin: 0 0 10px; }
  .cmt { padding: 7px 0; border-bottom: 1px dotted #d9c9a6; }
  .cmeta { font-size: 11px; color: var(--soft); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cmeta .btn { font-size: 10px; padding: 0 4px; }
  .cbody { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .cempty { color: var(--soft); font-size: 12px; margin: 0; }
  #cform { display: flex; gap: 6px; align-items: flex-end; margin-top: 12px; }
  #ctext { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid #888; background: #fff; font: inherit; color: inherit; resize: vertical; }

  footer { text-align: center; margin-top: 46px; color: var(--soft); font-size: 11px; }
  footer a { display: inline-block; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
  footer a:hover { color: var(--chip); }

  /* 편집 막대 */
  .editbar {
    position: fixed; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end;
    max-width: calc(100vw - 24px); padding: 6px 8px; background: #fff; border: 1px solid #111;
    box-shadow: 2px 2px 0 rgba(0,0,0,.3); z-index: 10; font-size: 12px;
  }

  /* 편집 창 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .dialog { width: 100%; max-width: 380px; max-height: 100%; overflow: auto; background: #fff; border: 1px solid #111; box-shadow: 3px 3px 0 rgba(0,0,0,.35); padding: 14px 16px 16px; font-size: 13px; }
  .dialog h2 { font-size: 14px; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  .field > label, .field > .lbl { display: block; font-size: 11px; color: var(--soft); margin-bottom: 3px; }
  .field input[type=text] { width: 100%; padding: 4px 6px; border: 1px solid #888; background: #fff; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .checks label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .preview { max-width: 140px; max-height: 140px; display: block; border: 1px solid var(--line); margin-bottom: 6px; }
  .row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
  .row input.sym { width: 38px; text-align: center; flex: none; }
  .row input.nm { flex: 1; min-width: 0; }
  .syms { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 2px; }
  .syms button { width: 22px; height: 22px; padding: 0; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  .err { color: #a33; font-size: 12px; min-height: 1.2em; margin-top: 6px; }
  #cform { flex-wrap: wrap; }
  #cname { width: 120px; padding: 4px 6px; border: 1px solid #888; background: #fff; }
  #ctext { flex-basis: 100%; }
  .admin { background: none; border: 0; padding: 0; margin-top: 8px; color: #b9b3a3; font-size: 10px; cursor: pointer; }
  .admin:hover { color: var(--ink); }
  /* 턴테이블 */
  .deck { width: 218px; padding: 8px; background: #fffdf6; border: 1px solid var(--line); box-shadow: 2px 2px 0 rgba(0,0,0,.18); font-size: 11px; z-index: 9; }
  .deck-top { border: 1px solid var(--line); background: #f1e6c9; }
  #tt { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #arm { transform-box: view-box; transform-origin: 238px 38px; transition: transform .45s; }
  #disc { cursor: grab; outline: none; }
  #disc:focus-visible #discLabel { stroke: #fffdf6; stroke-width: 3; }
  #discSpin { transform-box: view-box; transform-origin: 112px 105px; animation: spin 1.8s linear infinite; animation-play-state: paused; }
  .deck.playing #discSpin { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #discSpin { animation-duration: 12s; } #arm, .lp-disc, .knob { transition: none !important; } }
  .deck-info { margin: 6px 0; min-height: 30px; }
  .deck-state { font-size: 10px; color: var(--soft); }
  .deck-title { font-weight: 700; font-size: 12px; overflow-wrap: anywhere; }
  #ytbox { margin-bottom: 6px; border: 1px solid var(--line); background: #000; line-height: 0; }
  .crate { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; gap: 4px 0; border-top: 1px dashed var(--line); padding-top: 6px; max-height: 232px; overflow: auto; }
  .crate .cempty { grid-column: 1 / -1; }
  .lp { width: 62px; height: 72px; padding: 0; border: 0; background: none; cursor: grab; touch-action: none; position: relative; text-align: left; user-select: none; -webkit-user-select: none; }
  .lp-disc, .lp-ghost { border-radius: 50%; background: radial-gradient(circle, #fffdf6 0 5%, var(--c) 6% 36%, #161616 37% 100%); }
  .lp-disc { position: absolute; left: 8px; top: 20px; width: 46px; height: 46px; transition: top .28s; }
  .lp.out .lp-disc { top: 1px; }                       /* 판이 재킷 위로 빠져나옴 */
  .lp.on .lp-disc { visibility: hidden; }
  .sleeve { position: absolute; left: 4px; top: 17px; width: 54px; height: 54px; border: 1px solid #5c4a22; box-shadow: 1px 1px 0 rgba(0,0,0,.2); display: flex; align-items: flex-end; overflow: hidden; background-color: var(--s); }
  .sleeve.p-stripe { background-image: repeating-linear-gradient(45deg, var(--c) 0 3px, transparent 3px 9px); }
  .sleeve.p-dot { background-image: radial-gradient(circle, var(--c) 0 2px, transparent 2.6px); background-size: 9px 9px; }
  .sleeve.p-check { background-image: linear-gradient(color-mix(in srgb, var(--c) 55%, transparent) 50%, transparent 50%), linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, transparent) 50%, transparent 50%); background-size: 12px 12px; }
  .sl-title { width: 100%; background: #fffdf6; border-top: 1px solid #5c4a22; padding: 1px 2px; font-size: 9px; line-height: 1.2; max-height: 2.6em; overflow: hidden; overflow-wrap: anywhere; color: #111; }
  .lp.on .sleeve { outline: 2px solid var(--chip); outline-offset: 1px; }
  .lp-ghost { position: fixed; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none; z-index: 30; box-shadow: 3px 3px 0 rgba(0,0,0,.25); }
  .deck-off { margin-top: 6px; font-size: 10px; }
  .radio { display: flex; align-items: center; gap: 8px; border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  .radio-win { flex: 1; min-width: 0; border: 1px solid #5c4a22; background: #fff; padding: 4px 6px; font-size: 10px; overflow-wrap: anywhere; }
  .radio-win a { display: inline-block; margin-top: 3px; text-decoration: underline; color: #111; }
  .knob { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #5c4a22; position: relative; cursor: grab; touch-action: none; transition: transform .2s; box-shadow: 1px 1px 0 rgba(0,0,0,.3); }
  .knob.drag { transition: none; cursor: grabbing; }
  .knob::after { content: ""; position: absolute; left: 21px; top: 4px; width: 2px; height: 13px; background: #fffdf6; }
  .deck-help { margin: 6px 0 0; font-size: 9px; color: var(--soft); line-height: 1.4; }
  /* 음악 버튼(♬)은 오른쪽 아래. 턴테이블은 그 위에서 열리고 닫힘. 닫아도 화면 밖으로 밀어 둘 뿐이라 소리는 계속 남 */
  #deckToggle { position: fixed; right: 12px; bottom: 12px; z-index: 11; width: 44px; height: 44px; font-size: 18px; padding: 0; }
  .deck { position: fixed; right: 12px; bottom: 64px; max-height: calc(100vh - 80px); overflow: auto; transition: transform .25s; }
  .deck:not(.open) { transform: translateX(calc(100% + 40px)); }
  .editbar { right: 64px; max-width: calc(100vw - 170px); }
  @media (prefers-reduced-motion: reduce) { .deck { transition: none; } }

  /* 편집 중에는 머리말 글자를 눌러 바로 고칠 수 있음 */
  body.editing #siteName, body.editing #hint, body.editing #lucky { outline: 1px dashed var(--chip); outline-offset: 3px; cursor: pointer; }

  /* 왼쪽 아래 손그림 캐릭터: 원본 선화를 살려 작은 마스코트로 표시 */
  .buddy {
    position: fixed; left: 9px; bottom: 5px; z-index: 12;
    width: 98px; height: 119px; padding: 0;
    border: 0; background: transparent; cursor: pointer;
    transform-origin: 50% 94%;
    animation: buddy-idle 3.2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .buddy img, .buddy svg { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; }
  .buddy:hover { filter: drop-shadow(0 1px 1px rgba(0,0,0,.1)); }
  .buddy::before, .buddy::after {
    content: "✦"; position: absolute; z-index: 1; top: 12px; right: 2px;
    font-size: 14px; color: #de9a32; opacity: 0; pointer-events: none;
  }
  .buddy::after { content: "♡"; top: 32px; left: 0; right: auto; color: #d97970; }
  .buddy.is-reacting::before { animation: buddy-spark .9s ease-out both; }
  .buddy.is-reacting::after { animation: buddy-spark .9s .17s ease-out both; }
  @keyframes buddy-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes buddy-spark {
    0% { transform: translateY(8px) scale(.55); opacity: 0; }
    35% { opacity: 1; }
    100% { transform: translateY(-18px) rotate(25deg) scale(1.12); opacity: 0; }
  }
  body.editing .buddy { outline: 1px dashed var(--chip); outline-offset: 3px; }
  .bubble {
    position: fixed; left: 81px; bottom: 109px; z-index: 13;
    max-width: min(220px, calc(100vw - 98px));
    padding: 8px 11px; background: #fffdf6;
    border: 1px solid #403729; border-radius: 12px 12px 12px 3px;
    box-shadow: 2px 3px 0 rgba(0,0,0,.13);
    font-size: 12px; font-weight: 700; line-height: 1.5;
    overflow-wrap: anywhere;
    animation: bubble-appear .22s ease-out;
  }
  .bubble::after {
    content: ""; position: absolute; left: -5px; bottom: 10px; width: 9px; height: 9px;
    background: #fffdf6; border-left: 1px solid #403729; border-bottom: 1px solid #403729;
    transform: rotate(45deg);
  }
  @keyframes bubble-appear {
    from { opacity: 0; transform: translateY(7px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* 누르면 차례로 깡충 뛰기, 흔들기, 빙글 돌아 인사 */
  .buddy.t-jump { animation: t-jump .95s ease-out both; }
  .buddy.t-spin { animation: t-spin 1s ease-in-out both; }
  .buddy.t-wag { animation: t-wag .85s ease-in-out both; }
  @keyframes t-jump {
    0%, 100% { transform: translateY(0) scale(1); }
    15% { transform: translateY(0) scale(1.08,.9); }
    38% { transform: translateY(-31px) rotate(-7deg) scale(.98,1.04); }
    58% { transform: translateY(0) scale(1.08,.92); }
    77% { transform: translateY(-12px) rotate(5deg); }
  }
  @keyframes t-wag {
    0%, 100% { transform: rotate(0); }
    15%, 45%, 75% { transform: rotate(-12deg); }
    30%, 60%, 90% { transform: rotate(12deg); }
  }
  @keyframes t-spin {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    35% { transform: translateY(-17px) rotate(125deg) scale(.93); }
    70% { transform: translateY(-12px) rotate(290deg) scale(1.05); }
    100% { transform: translateY(0) rotate(360deg) scale(1); }
  }
  @media (max-width: 520px) {
    .buddy { left: 5px; bottom: 4px; width: 80px; height: 98px; }
    .bubble { left: 63px; bottom: 91px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .buddy, .buddy.t-jump, .buddy.t-wag, .buddy.t-spin,
    .buddy::before, .buddy::after, .bubble { animation: none !important; }
  }

  /* 음악 감상실 */
  #roomBtn { margin-left: 4px; }
  .room { position: fixed; inset: 0; z-index: 7; background-color: #f4ecd6; background-image: repeating-linear-gradient(0deg, rgba(184,148,85,.10) 0 1px, transparent 1px 28px); transition: background-color .6s, color .6s; }
  body.dim .room { background-color: #241f19; background-image: radial-gradient(circle at 50% 48%, rgba(255,214,140,.26), transparent 58%); color: #f3ead2; }
  body.room .wrap, body.room .editbar, body.room #deckToggle { display: none; }
  .room-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; }
  .room-bar .btn { color: #111; }
  .room-name { margin-right: auto; font-weight: 700; letter-spacing: .04em; }
  .room-clock { position: absolute; left: 28px; top: 64px; }
  #rcTime { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  #rcDate { font-size: 13px; margin-top: 8px; opacity: .85; }
  .room-sky { position: absolute; right: 28px; top: 64px; width: 172px; }
  .room-sky svg { display: block; width: 100%; height: auto; }
  .star { animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .room-card { background: #fffdf6; color: #111; border: 1px solid var(--line); box-shadow: 2px 2px 0 rgba(0,0,0,.2); padding: 10px; }
  .room-timer { position: absolute; right: 28px; bottom: 28px; width: 192px; }
  #tmLeft { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .room-timer .row { margin: 6px 0 0; flex-wrap: wrap; }
  #tmMsg { min-height: 1.4em; margin-top: 4px; color: #a04b00; font-weight: 700; }
  .room-timer.done { animation: nudge .5s 6; }
  @keyframes nudge { 50% { transform: translateY(-4px); } }
  .room-memo { position: absolute; left: 28px; bottom: 104px; width: 192px; background: #fff3b8; color: #111; border: 1px solid #c9a93a; box-shadow: 2px 3px 0 rgba(0,0,0,.2); padding: 8px 10px; transform: rotate(-1.5deg); }
  .room-memo label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
  #memo { display: block; width: 100%; height: 124px; border: 0; background: transparent; font: inherit; color: inherit; line-height: 1.6; resize: none; }
  #notes { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .note { position: absolute; left: 0; top: 0; font-size: 22px; color: var(--chip); opacity: 0; animation: rise 4.6s linear forwards; }
  @keyframes rise { 0% { transform: translate(var(--x), -30vh); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(calc(var(--x) + var(--dx)), -62vh) rotate(18deg); opacity: 0; } }
  body.room .deck { left: 50%; top: 54%; right: auto; bottom: auto; transform: translate(-50%, -50%) !important; width: min(860px, 58vw); max-height: calc(100vh - 110px);
    display: grid; grid-template-columns: 1.25fr 1fr; column-gap: 14px; align-content: start; padding: 14px; font-size: 13px; }
  body.room .deck-top { grid-column: 1; grid-row: 1 / span 7; align-self: start; }
  body.room .deck > :not(.deck-top) { grid-column: 2; }
  body.room .deck-state { font-size: 12px; } body.room .deck-title { font-size: 16px; }
  body.room .deck-help { font-size: 11px; }
  body.room .crate { grid-template-columns: repeat(auto-fill, 62px); justify-content: start; max-height: none; }
  @media (max-width: 1100px) {
    .room-side { display: none; }
    body.room .deck { width: 92vw; grid-template-columns: 1fr; }
    body.room .deck-top { grid-row: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .buddy.t-jump, .buddy.t-spin, .buddy.t-wag, .star, .room-timer.done { animation: none; } }
  .charpick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .charpick label { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border: 1px solid #ccc; cursor: pointer; font-size: 11px; }
  .charpick label:has(input:checked) { border-color: var(--chip); box-shadow: inset 0 0 0 1px var(--chip); }
  .charpick svg, .charpick img { width: 44px; height: 44px; object-fit: contain; }
  .charpick .none { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--soft); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .grid { columns: 2; } .wrap { padding-top: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="site-name" id="siteName"></p>
    <p class="hint" id="hint"></p>
    <button class="btn" id="lucky" type="button"></button><button class="btn" id="roomBtn" type="button">음악 감상실 ♬</button>
    <nav id="tags" aria-label="태그"></nav>
    <p class="note" id="note" hidden></p>
  </header>

  <main>
    <section id="list">
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
    </section>
    <article id="post" hidden>
      <a class="back" href="#home">← 목록으로</a>
      <div id="postHead"></div>
      <section class="comments">
        <h2>댓글 <span id="ccount"></span></h2>
        <div id="clist"></div>
        <form id="cform">
          <input type="text" id="cname" maxlength="20" placeholder="닉네임" aria-label="닉네임">

const okImg = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);

let site = clone(EMPTY), posts = [], loaded = false;

function normSite(d) {
  const o = Object.assign(clone(EMPTY), d || {});
  o.tags = (Array.isArray(o.tags) ? o.tags : []).filter(t => t && t.name).map(t => ({ name: String(t.name), symbol: String(t.symbol || "◎") }));
  const c = o.char && typeof o.char === "object" ? o.char : {};
  const kind = c.kind === "none" || !c.kind ? "included" : c.kind;
  o.char = { kind: ["included", "off", "dog", "cat", "bear", "rabbit", "ghost", "img"].includes(kind) ? kind : "included", say: String(c.say || ""), img: okImg(c.img) ? c.img : null };

/* 사진을 줄여서 글자(data URL)로 바꿈: 저장소 문서 크기 제한 때문에 작게 유지 */
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  let side = 720, q = 0.82, out = "";
  for (let n = 0; n < 6; n++) {
    const s = Math.min(1, side / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length < 600000) return out;
    side = Math.round(side * 0.8); q -= 0.07;
  }
  return out.length < 900000 ? out : null;
}

async function shrinkPng(file) {          /* 캐릭터 그림: 투명 배경을 살리려고 PNG로 작게 저장 */
  const bmp = await createImageBitmap(file);
  for (const side of [220, 160, 110]) {

    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const out = c.toDataURL("image/png");
    if (out.length < 250000) return out;

}

const LABELS = [["주황", "#ee861c", "#ffe0c2"], ["빨강", "#d9534f", "#ffd9e0"], ["파랑", "#4a7bd0", "#c9d9ff"], ["초록", "#4f9d69", "#cdeccd"], ["보라", "#8a63c9", "#e3d4f7"], ["노랑", "#e6c229", "#fff3b8"], ["갈색", "#b89455", "#f1e6c9"]];
const lab = c => LABELS.find(l => l[1] === c) || LABELS[0];
const PATS = [["줄무늬", "stripe"], ["도트", "dot"], ["체크", "check"], ["무늬 없음", "plain"]];
const okPat = (v, i) => PATS.some(x => x[1] === v) ? v : PATS[i % 3][1];
const DEMO = false;   /* 시연용 화면에서만 true: 소리 없이 동작만 보여 줌 */
const tt = $("tt"), arm = $("arm"), deck = $("deck"), knob = $("knob");

let ytPlayer = null, ytReady = false, ytPending = null, ytLoading = false, ytOwner = null;   /* ytOwner: 지금 유튜브를 쓰는 쪽 ("lp" 또는 "radio") */
const syncToggle = () => {
  $("deckToggle").classList.toggle("primary", playing || wantPlay || radioIdx > 0);
  $("ytbox").hidden = !(cur || ytOwner === "radio");      /* 유튜브 화면은 유튜브를 틀 때만 턴테이블 아래에 보임 */
};

function ytParse(url) {
  try {
    const u = new URL(url), h = u.hostname.replace(/^(www|m|music)\./, "");
    let v = null, list = u.searchParams.get("list");
    if (h === "youtu.be") v = u.pathname.slice(1);
    else if (h === "youtube.com") {
      if (u.pathname === "/watch") v = u.searchParams.get("v");
      else { const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]+)/); if (m) v = m[2]; }
    } else return null;
    if (v && !/^[\w-]{6,20}$/.test(v)) v = null;
    if (list && !/^[\w-]{6,64}$/.test(list)) list = null;
    return v || list ? { v, list } : null;
  } catch (e) { return null; }
}
const okStream = url => { try { return new URL(url).protocol === "https:"; } catch (e) { return false; } };

function deckText(state, title) { $("deckState").textContent = state; $("deckTitle").textContent = title || ""; }
function idleText() { deckText(lps.length ? "재킷을 눌러 판을 꺼내 보세요" : "아직 판이 없습니다", ""); }
function setArm(deg) { arm.style.transform = `rotate(${deg}deg)`; }
function uiPlaying(on) {
  playing = on;
  deck.classList.toggle("playing", on && !!cur);
  setArm(on && cur ? 32 : 0);
  if (cur) deckText(on ? "재생 중" : "멈춤 · 판을 누르면 다시 재생", cur.title);
  syncToggle();
}

/* 유튜브 */
function ensureYT() {
  if (ytLoading) return;
  ytLoading = true;
  if (DEMO) {
    const fake = () => {
      const st = stations[radioIdx - 1];
      if (ytOwner === "radio" && st) deckText("라디오 재생 중 (시연: 소리 없음)", st.name);
      else if (cur && wantPlay) uiPlaying(true);
    };
    ytPlayer = { cueVideoById: () => setTimeout(fake, 600), cuePlaylist: () => setTimeout(fake, 600), playVideo: fake, pauseVideo: () => {} };
    $("yt").style.cssText = "height:200px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;line-height:1.5;text-align:center;padding:0 10px";
    $("yt").textContent = "(시연) 실제 사이트에서는 여기에 유튜브 화면이 나옵니다. 광고가 뜨면 여기서 건너뛰기를 누릅니다.";
    ytReady = true;
    if (ytPending) { const src = ytPending; ytPending = null; ytCue(src); }
    return;
  }
  window.onYouTubeIframeAPIReady = () => {
    ytPlayer = new YT.Player("yt", {
      width: "100%", height: "200", playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => { ytReady = true; if (ytPending) { const src = ytPending; ytPending = null; ytCue(src); } },
        onStateChange: e => {
          if (e.data === 5 && wantPlay) return ytPlayer.playVideo();
          if (ytOwner === "radio") {
            const st = stations[radioIdx - 1];
            if (st && e.data === 1) deckText("라디오 재생 중", st.name);
            if (st && e.data === 2) deckText("라디오 멈춤", st.name);
            return;
          }
          if (!cur) return;
          if (e.data === 1) uiPlaying(true);
          else if (e.data === 2) { wantPlay = false; uiPlaying(false); }
          else if (e.data === 0) setTimeout(() => {          /* 재생목록은 곡 사이에 잠깐 끝남 상태가 되므로 조금 기다렸다 판단 */
            let st = 0; try { st = ytPlayer.getPlayerState(); } catch (x) {}
            if (cur && st !== 1 && st !== 3) { wantPlay = false; uiPlaying(false); }
          }, 1500);
        },
        onError: () => {
          const st = stations[radioIdx - 1];
          if (ytOwner === "radio") { if (st) deckText("이 방송은 여기서 재생할 수 없습니다.", st.name); return; }
          wantPlay = false; uiPlaying(false); deckText("이 영상은 여기서 재생할 수 없습니다.", cur ? cur.title : "");
        }
      }
    });
  };
  const sc = document.createElement("script");
  sc.src = "https://www.youtube.com/iframe_api";
  sc.onerror = () => deckText("유튜브를 불러오지 못했습니다.", cur ? cur.title : "");
  document.head.appendChild(sc);
}
function ytCue(src) {
  if (!ytReady) { ytPending = src; ensureYT(); return; }
  if (src.v) ytPlayer.cueVideoById(src.v); else ytPlayer.cuePlaylist({ list: src.list });
}
function ytStop() { if (ytReady) { try { ytPlayer.pauseVideo(); } catch (e) {} } }

/* 판 올리기 · 내리기 */
function loadLP(id) {
  const it = lps.find(x => x.id === id);
  if (!it) return;
  const src = ytParse(it.url);
  if (!src) { deckText("이 판의 주소가 올바르지 않습니다.", it.title); return; }
  setRadio(0, true);
  ytStop();
  ytOwner = "lp";

  deck.classList.remove("playing");

}
function unloadLP() {
  wantPlay = false; ytStop(); ytPending = null;
  cur = null; playing = false;
  deck.classList.remove("playing"); setArm(0);
  $("disc").setAttribute("hidden", "");

function play() { if (!cur) return; wantPlay = true; setArm(32); if (ytReady) { try { ytPlayer.playVideo(); } catch (e) {} } }
function pause() { wantPlay = false; ytStop(); uiPlaying(false); }
/* 턴테이블 창을 접어도(♬) 소리는 계속 납니다: 창을 없애지 않고 화면 밖으로 밀어 두기만 함 */

/* 끌기: 재킷(또는 삐져나온 판)을 끌어 턴테이블에 놓기, 올려진 판을 끌어내기 */
const overPlatter = e => {
  const r = $("platter").getBoundingClientRect();
  return Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) <= r.width / 2 + 16;
};
function makeGhost(color, e) {
  const g = document.createElement("div");
  g.className = "lp-ghost"; g.style.setProperty("--c", lab(color)[1]);
  g.style.left = e.clientX + "px"; g.style.top = e.clientY + "px";
  document.body.appendChild(g);
  return g;
}
function dragSource(el, pick, drop) {
  let d = null, skipClick = false;
  el.addEventListener("pointerdown", e => {
    const it = pick(e);
    if (!it) return;
    d = { it, x: e.clientX, y: e.clientY, ghost: null };
    try { (e.target.closest(".lp") || el).setPointerCapture(e.pointerId); } catch (x) {}
  });
  el.addEventListener("pointermove", e => {
    if (!d) return;
    if (!d.ghost && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) d.ghost = makeGhost(d.it.color, e);
    if (d.ghost) { d.ghost.style.left = e.clientX + "px"; d.ghost.style.top = e.clientY + "px"; }
  });
  const end = e => {
    if (!d) return;
    const dragged = !!d.ghost, it = d.it;
    if (d.ghost) d.ghost.remove();
    d = null;
    if (dragged) { skipClick = true; setTimeout(() => { skipClick = false; }, 0); if (e.type === "pointerup") drop(it, overPlatter(e), true); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("click", e => {
    if (skipClick) { skipClick = false; return; }
    const it = pick(e);
    if (it) drop(it, true, false);
  });
}
dragSource($("shelf"), e => { const b = e.target.closest(".lp"); return b ? lps.find(x => x.id === b.dataset.id) : null; },
  (it, onPlatter, dragged) => {
    if (cur && cur.id === it.id) return;
    if (dragged) { if (onPlatter) loadLP(it.id); }
    else if (outId !== it.id) {                                    /* 첫 번째 누름: 판이 재킷에서 나옴 */
      outId = it.id;
      $("shelf").querySelectorAll(".lp").forEach(b => b.classList.toggle("out", b.dataset.id === outId));
    }
    else loadLP(it.id);                                            /* 나온 판을 한 번 더 누름: 올리기 */
  });
const discToggle = () => { if (playing || wantPlay) pause(); else play(); };
dragSource($("disc"), () => cur, (it, onPlatter, dragged) => { if (dragged) { if (!onPlatter) unloadLP(); } else discToggle(); });
$("disc").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); discToggle(); } });
$("deckOff").addEventListener("click", unloadLP);
function setDeck(open) {
  deck.classList.toggle("open", open);
  if (open) deck.removeAttribute("inert"); else deck.setAttribute("inert", "");
  $("deckToggle").setAttribute("aria-expanded", String(open));
}
$("deckToggle").addEventListener("click", () => setDeck(!deck.classList.contains("open")));
setDeck(window.innerWidth >= 1380);       /* 넓은 화면에서는 처음부터 열어 둠 */

/* 라디오 다이얼: 맨 왼쪽이 꺼짐, 오른쪽으로 돌릴수록 다음 방송 */
const knobAngle = i => stations.length ? -120 + 240 * i / stations.length : 0;
function setRadio(i, quiet) {
  radioIdx = Math.max(0, Math.min(stations.length, i));
  const st = stations[radioIdx - 1];
  knob.classList.remove("drag");
  knob.style.transform = `rotate(${knobAngle(radioIdx)}deg)`;
  knob.setAttribute("aria-valuemax", String(stations.length));
  knob.setAttribute("aria-valuenow", String(radioIdx));
  knob.setAttribute("aria-valuetext", st ? st.name : "꺼짐");
  $("radioWin").textContent = st ? "◎ " + st.name : "라디오 꺼짐";
  try { audio.pause(); } catch (e) {}
  audio.removeAttribute("src");
  if (ytOwner === "radio") { wantPlay = false; ytStop(); ytOwner = null; }
  syncToggle();
  if (!st) { if (!quiet && !cur) idleText(); return; }
  if (cur) unloadLP();
  syncToggle();
  if (st.kind === "link") {            /* 다른 사이트에서만 들을 수 있는 방송: 새 창으로 연다 */
    const a = document.createElement("a");
    a.href = st.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "새 창에서 듣기 ↗";
    $("radioWin").append(document.createElement("br"), a);
    deckText("새 창에서 듣는 방송입니다", st.name);
    return;
  }
  const ysrc = ytParse(st.url);
  if (ysrc) {                          /* 유튜브 영상·실시간 방송·재생목록을 라디오로 틀기 */
    ytOwner = "radio"; wantPlay = true; syncToggle();
    deckText("라디오 연결 중...", st.name);
    ytCue(ysrc);
    return;
  }
  if (DEMO) { deckText("라디오 재생 중 (시연: 소리 없음)", st.name); return; }
  deckText("라디오 연결 중...", st.name);
  audio.src = st.url;
  audio.play().catch(() => { if (stations[radioIdx - 1] === st) deckText("이 방송은 지금 들을 수 없습니다.", st.name); });
}
audio.addEventListener("playing", () => { const st = stations[radioIdx - 1]; if (st) deckText("라디오 재생 중", st.name); });
audio.addEventListener("error", () => { const st = stations[radioIdx - 1]; if (st) deckText("이 방송은 지금 들을 수 없습니다.", st.name); });
let kd = null;
knob.addEventListener("pointerdown", e => {
  e.preventDefault();
  try { knob.setPointerCapture(e.pointerId); } catch (x) {}
  kd = { x: e.clientX, y: e.clientY, moved: false, a: knobAngle(radioIdx) };
});
knob.addEventListener("pointermove", e => {
  if (!kd) return;
  if (Math.hypot(e.clientX - kd.x, e.clientY - kd.y) > 4) kd.moved = true;
  if (!kd.moved) return;
  const r = knob.getBoundingClientRect();
  const a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
  kd.a = Math.max(-120, Math.min(120, a));
  knob.classList.add("drag");
  knob.style.transform = `rotate(${kd.a}deg)`;
});
knob.addEventListener("pointerup", () => {
  if (!kd) return;
  const n = stations.length, k = kd; kd = null;
  if (!n) return setRadio(0);
  setRadio(k.moved ? Math.round((k.a + 120) / 240 * n) : (radioIdx + 1) % (n + 1));
});
knob.addEventListener("pointercancel", () => { kd = null; setRadio(radioIdx, true); });
knob.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setRadio(radioIdx + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setRadio(radioIdx - 1); }
});

function renderShelf() {

  }).join("") : `<p class="cempty">${canEdit ? "‘✎ 편집 → LP 관리’에서 판을 추가해 주세요." : "아직 판이 없습니다."}</p>`;
  $("radio").hidden = !stations.length && !canEdit;
  if (!stations.length) $("radioWin").textContent = canEdit ? "‘라디오 관리’에서 방송을 추가해 주세요" : "라디오 꺼짐";

function lpDialog() {
  const rowHTML = x => `<div class="field lprow" data-id="${esc(x.id)}" style="border:1px dotted #bbb;padding:6px">
    <div class="row"><input type="text" class="nm lt" maxlength="40" value="${esc(x.title)}" placeholder="제목 (재킷에 적힐 이름)" aria-label="제목">
      <button type="button" class="btn" data-rm>✕</button></div>
    <div class="row"><input type="text" class="nm lu" maxlength="300" value="${esc(x.url)}" placeholder="유튜브 영상 또는 재생목록 주소" aria-label="유튜브 주소"></div>
    <div class="row" style="margin:0"><select class="lc" aria-label="색">${LABELS.map(l => `<option value="${l[1]}"${lab(x.color)[1] === l[1] ? " selected" : ""}>${l[0]}</option>`).join("")}</select>
      <select class="lpat" aria-label="재킷 무늬">${PATS.map(q => `<option value="${q[1]}"${x.pat === q[1] ? " selected" : ""}>${q[0]}</option>`).join("")}</select></div></div>`;
  openDialog("LP 관리", `<div id="lprows">${lps.map(rowHTML).join("")}</div>
    <button type="button" class="btn" id="addLp">＋ 판 추가</button>`,
    async () => {
      const rows = [...$("lprows").querySelectorAll(".lprow")].map(r => ({
        id: r.dataset.id, title: r.querySelector(".lt").value.trim(), url: r.querySelector(".lu").value.trim(), color: lab(r.querySelector(".lc").value)[1], pat: okPat(r.querySelector(".lpat").value, 0)
      }));
      if (rows.some(r => !r.title)) return "제목이 빈 판이 있습니다.";
      const bad = rows.find(r => !ytParse(r.url));
      if (bad) return `‘${bad.title}’의 주소가 유튜브 주소가 아닙니다.`;
      await setDoc(playerRef, { items: rows }, { merge: true });
    });
  $("dialog").addEventListener("click", e => { if (e.target.dataset.rm !== undefined) e.target.closest(".lprow").remove(); });
  $("addLp").onclick = () => {
    const n = $("lprows").querySelectorAll(".lprow").length;
    $("lprows").insertAdjacentHTML("beforeend", rowHTML({ id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: "", url: "", color: LABELS[n % LABELS.length][1], pat: PATS[n % 3][1] }));
    $("lprows").lastElementChild.querySelector(".lt").focus();
  };
}
function radioDialog() {
  const rowHTML = x => `<div class="field strow" style="border:1px dotted #bbb;padding:6px">
    <div class="row"><input type="text" class="nm sn" maxlength="30" value="${esc(x.name)}" placeholder="방송 이름" aria-label="방송 이름">
      <button type="button" class="btn" data-rm>✕</button></div>
    <div class="row"><input type="text" class="nm su" maxlength="300" value="${esc(x.url)}" placeholder="https로 시작하는 주소" aria-label="방송 주소"></div>
    <div class="row" style="margin:0"><select class="sk" aria-label="듣는 방식"><option value="stream"${x.kind !== "link" ? " selected" : ""}>여기서 바로 재생 (유튜브 또는 스트림 주소)</option><option value="link"${x.kind === "link" ? " selected" : ""}>새 창으로 열기 (방송국 사이트)</option></select></div></div>`;
  openDialog("라디오 관리", `<div id="strows">${stations.map(rowHTML).join("")}</div>
    <button type="button" class="btn" id="addSt">＋ 방송 추가</button>
    <div style="font-size:11px;color:var(--soft);margin-top:8px;line-height:1.5">다이얼을 오른쪽으로 돌릴 때 위에서부터 차례로 나옵니다. ‘바로 재생’에는 유튜브 영상·실시간 방송·재생목록 주소나 인터넷 라디오의 재생(스트림) 주소를 넣습니다. MBC처럼 자기 사이트에서만 들을 수 있는 방송은 ‘새 창으로 열기’로 넣어 주세요.</div>`,
    async () => {
      const rows = [...$("strows").querySelectorAll(".strow")].map(r => ({ name: r.querySelector(".sn").value.trim(), url: r.querySelector(".su").value.trim(), kind: r.querySelector(".sk").value === "link" ? "link" : "stream" }));
      if (rows.some(r => !r.name)) return "이름이 빈 방송이 있습니다.";
      const bad = rows.find(r => !okStream(r.url));
      if (bad) return `‘${bad.name}’의 주소는 https로 시작해야 합니다.`;
      await setDoc(playerRef, { stations: rows }, { merge: true });
    });
  $("dialog").addEventListener("click", e => { if (e.target.dataset.rm !== undefined) e.target.closest(".strow").remove(); });
  $("addSt").onclick = () => {
    $("strows").insertAdjacentHTML("beforeend", rowHTML({ name: "", url: "", kind: "stream" }));
    $("strows").lastElementChild.querySelector(".sn").focus();
  };
}

deckText("불러오는 중...", "");
onSnapshot(playerRef, s => {
  const d = s.exists() ? s.data() : {};
  lps = (Array.isArray(d.items) ? d.items : []).filter(x => x && x.id && x.title && x.url)
    .map((x, i) => ({ id: String(x.id), title: String(x.title), url: String(x.url), color: lab(x.color)[1], pat: okPat(x.pat, i) }));
  const playingSt = stations[radioIdx - 1];
  stations = (Array.isArray(d.stations) ? d.stations : []).filter(x => x && x.name && okStream(x.url)).map(x => ({ name: String(x.name), url: String(x.url), kind: x.kind === "link" ? "link" : "stream" }));
  if (playingSt) {
    const at = stations.findIndex(x => x.url === playingSt.url);
    if (at < 0) { radioIdx = 0; setRadio(0, true); } else { radioIdx = at + 1; knob.style.transform = `rotate(${knobAngle(radioIdx)}deg)`; }
  }
  if (cur) {
    const still = lps.find(x => x.id === cur.id);
    if (!still || still.url !== cur.url) unloadLP(); else { cur = still; $("discLabel").setAttribute("fill", lab(cur.color)[1]); $("deckTitle").textContent = cur.title; }
  } else if (!radioIdx) idleText();
  if (outId && !lps.some(x => x.id === outId)) outId = null;
  renderShelf();
}, () => deckText("판 목록을 불러오지 못했습니다.", ""));

/* ───── 음악 감상실: 턴테이블을 화면 가득 띄워 두는 방 ───── */
const inRoom = () => location.hash === "#music";
let wasRoom = false, deckWasOpen = false, roomTick = null, noteTick = null, lastSkyKey = "";
$("roomBtn").addEventListener("click", () => { location.hash = "#music"; });

function drawSky(d) {
  const h = d.getHours() + d.getMinutes() / 60;
  const mode = h >= 7 && h < 17 ? "day" : (h >= 5.5 && h < 7) || (h >= 17 && h < 19) ? "dusk" : "night";
  if (mode === lastSkyKey) return;
  lastSkyKey = mode;
  const sky = { day: "#bfe3ff", dusk: "#ffc98f", night: "#1f2a4a" }[mode];
  const stars = mode === "night" ? [[24, 24], [52, 40], [78, 18], [104, 34], [128, 22], [40, 66], [96, 62], [134, 58]]
    .map((q, i) => `<circle class="star" style="animation-delay:${i * .3}s" cx="${q[0]}" cy="${q[1]}" r="1.6" fill="#fff"/>`).join("") : "";
  const body = mode === "night" ? `<circle cx="118" cy="40" r="13" fill="#fff3b8"/><circle cx="124" cy="36" r="11" fill="${sky}"/>`
    : mode === "dusk" ? `<circle cx="80" cy="96" r="20" fill="#ee861c"/>`
    : `<circle cx="116" cy="38" r="14" fill="#ffd84a"/><ellipse cx="46" cy="44" rx="18" ry="7" fill="#fff"/><ellipse cx="60" cy="40" rx="13" ry="7" fill="#fff"/>`;
  $("sky").innerHTML = `<svg viewBox="0 0 160 124"><rect x="6" y="6" width="148" height="104" fill="${sky}"/>${stars}${body}
    <rect x="6" y="6" width="148" height="104" fill="none" stroke="#5c4a22" stroke-width="6"/>
    <path d="M80 6 V110 M6 58 H154" stroke="#5c4a22" stroke-width="3"/><rect x="0" y="110" width="160" height="10" fill="#8c7440" stroke="#5c4a22"/></svg>`;
}
function roomClock() {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  $("rcTime").textContent = `${z(d.getHours())}:${z(d.getMinutes())}`;
  $("rcDate").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
  drawSky(d);
}
function spawnNote() {                                   /* 소리가 나는 동안 음표가 떠오름 */
  if (!(playing || radioIdx > 0)) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const n = document.createElement("span");
  n.className = "note"; n.textContent = "♪♬♩"[Math.floor(Math.random() * 3)];
  n.style.setProperty("--x", Math.round(Math.random() * 360 - 180) + "px");
  n.style.setProperty("--dx", Math.round(Math.random() * 80 - 40) + "px");
  n.addEventListener("animationend", () => n.remove());
  $("notes").appendChild(n);
}
function syncRoom() {
  const on = inRoom();
  document.body.classList.toggle("room", on);
  $("room").hidden = !on;
  if (on === wasRoom) return;
  wasRoom = on;
  if (on) {
    deckWasOpen = deck.classList.contains("open");
    setDeck(true);
    const h = new Date().getHours();
    document.body.classList.toggle("dim", h >= 19 || h < 6);      /* 저녁 7시부터 아침 6시까지는 조명을 낮춤 */
    roomClock();
    roomTick = setInterval(roomClock, 1000);
    noteTick = setInterval(spawnNote, 1100);
  } else {
    clearInterval(roomTick); clearInterval(noteTick);
    document.body.classList.remove("dim");
    $("notes").innerHTML = "";
    setDeck(deckWasOpen);
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
  }
}
$("roomLight").addEventListener("click", () => document.body.classList.toggle("dim"));
$("roomFull").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
});
document.addEventListener("fullscreenchange", () => { $("roomFull").textContent = document.fullscreenElement ? "전체 화면 끄기" : "전체 화면"; });

/* 공부 타이머 */
const tm = { total: 25 * 60, left: 25 * 60, end: 0, id: null };
function tmShow() {
  const z = n => String(n).padStart(2, "0");
  $("tmLeft").textContent = `${z(Math.floor(tm.left / 60))}:${z(tm.left % 60)}`;
  $("tmGo").textContent = tm.id ? "멈춤" : "시작";
}
function tmStop() { clearInterval(tm.id); tm.id = null; tmShow(); }
function chime() {
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 660].forEach((f, i) => {
      const o = C.createOscillator(), g = C.createGain(), t = C.currentTime + i * .4;
      o.frequency.value = f; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
      o.start(t); o.stop(t + 1);
    });
  } catch (e) {}
}
$("tmGo").addEventListener("click", () => {
  if (tm.id) return tmStop();
  if (tm.left <= 0) tm.left = tm.total;
  $("tmMsg").textContent = ""; $("timer").classList.remove("done");
  tm.end = Date.now() + tm.left * 1000;
  tm.id = setInterval(() => {
    tm.left = Math.max(0, Math.round((tm.end - Date.now()) / 1000));
    if (tm.left <= 0) { tmStop(); $("tmMsg").textContent = "시간이 다 됐어요!"; $("timer").classList.add("done"); chime(); }
    tmShow();
  }, 500);
  tmShow();
});
$("tmReset").addEventListener("click", () => { tmStop(); tm.left = tm.total; $("tmMsg").textContent = ""; $("timer").classList.remove("done"); tmShow(); });
$("timer").addEventListener("click", e => {
  const m = Number(e.target.dataset.min);
  if (!m) return;
  tmStop(); tm.total = tm.left = m * 60; $("tmMsg").textContent = ""; $("timer").classList.remove("done"); tmShow();
});

/* 오늘 할 일 메모: 이 브라우저에만 저장됨 */
try { $("memo").value = localStorage.getItem("blog-memo") || ""; } catch (e) {}
let memoTimer = null;
$("memo").addEventListener("input", () => {
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => { try { localStorage.setItem("blog-memo", $("memo").value); } catch (e) {} }, 400);
});

/* ───── 시작 ───── */
render();
onSnapshot(mainRef, s => { site = normSite(s.exists() ? s.data() : null); render(); },
  () => note("내용을 불러오지 못했습니다."));
onSnapshot(query(collection(db, "posts"), orderBy("order")), s => {
  posts = s.docs.map(d => {
    const x = d.data();
    return { id: d.id, title: String(x.title || ""), tags: Array.isArray(x.tags) ? x.tags.map(String) : [], img: okImg(x.img) ? x.img : null, order: Number(x.order) || 0 };
  });
  loaded = true; render();
}, () => note("내용을 불러오지 못했습니다."));
</script>
